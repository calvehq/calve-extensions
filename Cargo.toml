[workspace]
resolver = "3"
members = ["crates/*", "extensions/*/native", "extensions/*/cic", "xtask"]
default-members = ["crates/*", "extensions/*/native", "extensions/*/cic"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/calvehq/calve-extensions"
publish = false

[workspace.dependencies]
calve-domain = { path = "crates/calve-domain" }
cic-guest = { path = "crates/cic-guest" }
# The Calve Integration Contract and Calve's host crates, pinned by calve-cli commit (ADR 0019).
# All three use the same rev; `scripts/bump-contract.sh` moves it and `cargo xtask
# check-contract` checks it against docs/contract-pins.md. Before the commit is public,
# `source scripts/dev-env.sh` rewrites the transport to a local checkout (never the lockfile).
calve-integration-contract = { git = "https://github.com/calvehq/calve-cli.git", rev = "f7f6a37b2980f982b98dd183316d2288acdb5667" }
calve-testkit = { git = "https://github.com/calvehq/calve-cli.git", rev = "f7f6a37b2980f982b98dd183316d2288acdb5667" }
calve-app = { git = "https://github.com/calvehq/calve-cli.git", rev = "f7f6a37b2980f982b98dd183316d2288acdb5667" }
openaevc = { git = "https://github.com/calvehq/openaevc.git", tag = "v0.1.0", version = "=0.1.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
proptest = "1.11"

[workspace.lints.rust]
# Denied (not forbidden) so the cic-guest ABI module can allow it; `cargo xtask
# check-architecture` refuses `unsafe` anywhere else.
unsafe_code = "deny"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
