name: ci
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          # Later steps need no git credentials: every git dependency is public.
          persist-credentials: false
      # rust-toolchain.toml is the only source of the version, components and targets.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Checks
        shell: bash
        run: |
          cargo xtask check-contract
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo xtask check-architecture
      - name: Packages and SBOM
        shell: bash
        run: |
          cargo xtask dist --out dist
          cargo xtask sbom dist/sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist
