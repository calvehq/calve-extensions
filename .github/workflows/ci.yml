name: ci
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          # Later steps need no git credentials: every git dependency is public.
          persist-credentials: false
      # rust-toolchain.toml is the only source of the version, components and targets.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustc --version
      # aws-lc-sys (TUF signature verification) assembles its x86-64 code with NASM, which the
      # Windows image lacks; Linux builds the same code with the system assembler.
      - name: NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        with:
          version: 2.16.03
      - name: Native build prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          nasm -v
          if ($LASTEXITCODE -ne 0) { throw "NASM is not on PATH; aws-lc-sys cannot build" }
          # cl.exe is found through Visual Studio discovery (as the cc crate does), not PATH.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "No Visual Studio installation with the MSVC x64 tools" }
          "MSVC tools: $vs"
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Checks
        shell: bash
        run: |
          cargo xtask check-contract
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo xtask check-architecture
      - name: Packages and SBOM
        shell: bash
        run: |
          cargo xtask dist --out dist
          cargo xtask sbom dist/sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist
