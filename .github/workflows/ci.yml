name: ci
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          path: calve-extensions
      - name: Pinned contract
        id: pin
        shell: bash
        run: echo "rev=$(cat calve-extensions/CONTRACT_PIN)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: calvehq/calve-cli
          ref: ${{ steps.pin.outputs.rev }}
          path: calve-cli
          fetch-depth: 0
      - name: Checks
        working-directory: calve-extensions
        shell: bash
        run: |
          cargo xtask check-contract
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo xtask check-architecture
      - name: Packages and SBOM
        working-directory: calve-extensions
        shell: bash
        run: |
          cargo xtask dist --out dist
          cargo xtask sbom dist/sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: calve-extensions/dist
